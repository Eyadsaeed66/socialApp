<nav class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo/Brand -->
      <a class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="/assets/images/route.png" class="h-8 rounded" alt="Route Logo" />
        <span class="self-center text-xl text-heading font-semibold whitespace-nowrap"
          >Route Posts</span
        >
      </a>

      <!-- Nav Links -->
      <div class="items-center justify-between hidden w-full md:flex md:w-auto" id="navbar-user">
        <ul
          class="font-medium flex flex-col p-4 md:p-1.5 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:bg-secondColor/60"
        >
          <li>
            <a
              routerLink="/feed"
              routerLinkActive="bg-white text-main-color font-bold"
              class="block  py-2 px-3 text-gray-600 rounded"
              aria-current="page"
            >
              <i class="fa-regular fa-house"></i> Feed</a
            >
          </li>
          <li>
            <a
              routerLink="/profile"
              routerLinkActive="bg-white text-main-color font-bold"
              class="block  py-2 px-3 text-gray-600 rounded"
              aria-current="page"
            >
              <i class="fa-regular fa-user"></i> Profile</a
            >
          </li>
          <li>
            <a
              routerLink="/notifications"
              routerLinkActive="bg-white text-main-color font-bold"
              class="block py-2 px-3 text-gray-600 rounded"
              aria-current="page"
            >
              <i class="fa-regular fa-comment"></i> Notifications</a
            >
          </li>
        </ul>
      </div>

      <!-- User Profile Dropdown -->
      <div class="relative profile-dropdown">
        <!-- Profile Button -->
        <button
          (click)="toggleDropdown()"
          class="flex items-center space-x-3 cursor-pointer focus:outline-none group"
        >
          <!-- User Avatar -->
          <div class="relative">
            <img
              src="/assets/images/default-profile.png"
              alt="user profile photo"
              class="w-10 h-10 rounded-full border-2 border-gray-200"
            />
            <!-- Online Status -->
            <span
              class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"
            ></span>
          </div>

          <!-- User Info (Desktop) -->
          <div class="hidden md:block text-left">
            <p class="text-sm font-semibold text-gray-700 group-hover:text-blue-600 transition">
              Ahmed Reda
            </p>
            <p class="text-xs text-gray-500">Admin</p>
          </div>

          <!-- Dropdown Arrow -->
          <svg
            [class.rotate-180]="isDropdownOpen"
            class="w-4 h-4 text-gray-500 transition-transform duration-200"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        @if (isDropdownOpen) {
          <div
            class="absolute right-0 mt-3 w-64 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50"
          >
            <!-- User Info Header -->
            <div class="px-4 py-3 border-b border-gray-100">
              <p class="text-sm font-semibold text-gray-800">Ahmed Reda</p>
              <p class="text-xs text-gray-500 mt-0.5">ahmedreda@gmail.com</p>
            </div>

            <!-- Menu Items -->
            <div class="py-2">
              <!-- Change Password -->
              <button
                routerLink="/changePassword"
                (click)="closeDropdown()"
                class="w-full cursor-pointer flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition"
              >
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
                  ></path>
                </svg>
                Change Password
              </button>

              <!-- Divider -->
              <div class="border-t border-gray-100 my-2"></div>

              <!-- Sign Out -->
              <button
              (click)="logout()"
                (click)="closeDropdown()"
                class="w-full cursor-pointer flex items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition"
              >
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  ></path>
                </svg>
                Log Out
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
